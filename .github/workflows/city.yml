name: Build contribution city

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/build_city.py"
      - ".github/workflows/city.yml"

concurrency:
  group: contribution-city
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Generate city
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile scripts/build_city.py

      - name: Generate SVGs and interactive page
        env:
          GH_TOKEN: ${{ secrets.CITY_TOKEN || github.token }}
          GH_USER: KOR1K1
        run: python scripts/build_city.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/city.svg assets/city-mobile.svg docs/index.html docs/data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: rebuild contribution city"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload GitHub Pages artifact
        if: vars.ENABLE_CITY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy interactive city
    if: vars.ENABLE_CITY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
