name: Develop exposure

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/exposure/**"
      - "assets/fonts/**"
      - ".github/workflows/exposure.yml"

concurrency:
  group: exposure
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render
        env:
          # The default token is enough while private contributions are shown
          # on the profile; a PAT in EXPOSURE_TOKEN overrides it if they are not.
          GH_TOKEN: ${{ secrets.EXPOSURE_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: node --experimental-strip-types scripts/exposure/build.ts

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exposure.svg assets/exposure-mobile.svg docs/data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "develop exposure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
